name: Validate preview shelf
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python scripts/check_public_shelf.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm test
