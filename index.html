<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>心理金融书籍库</title>
<meta name="description" content="心理学 · 经济 · 金融 · 管理 参考书籍与讲义资料库">
<style>
:root {
  --bg: #faf8f5;
  --card: #ffffff;
  --fg: #1a1a1a;
  --dim: #6b6b6b;
  --accent: #c8553d;
  --accent-dim: #a8442f;
  --border: #e8e4de;
  --tag: #f0ebe4;
  --shadow: 0 2px 16px rgba(0,0,0,0.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141414;
    --card: #1f1f1f;
    --fg: #e8e8e8;
    --dim: #999;
    --accent: #e8755f;
    --accent-dim: #c8553d;
    --border: #2e2e2e;
    --tag: #2a2a2a;
    --shadow: 0 2px 16px rgba(0,0,0,0.3);
  }
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Noto Serif CJK SC", Georgia, serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.7;
  min-height: 100vh;
}

/* ===== 密码门 ===== */
.gate {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 999;
  transition: opacity .5s;
}
.gate.hidden { opacity: 0; pointer-events: none; }
.gate-box {
  text-align: center;
  padding: 40px;
  width: 320px;
}
.gate-box .icon {
  width: 56px; height: 56px;
  margin: 0 auto 20px;
  border-radius: 14px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 26px;
}
.gate-box h1 { font-size: 1.4em; margin-bottom: 6px; }
.gate-box p { color: var(--dim); font-size: .9em; margin-bottom: 24px; }
.gate-box input {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  color: var(--fg);
  font-size: 1em;
  outline: none;
  margin-bottom: 10px;
}
.gate-box input:focus { border-color: var(--accent); }
.gate-box button {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 1em;
  cursor: pointer;
}
.gate-box button:hover { background: var(--accent-dim); }
.gate-err { color: var(--accent); font-size: .85em; margin-top: 8px; min-height: 1.2em; }

/* ===== 主内容 ===== */
.container { max-width: 920px; margin: 0 auto; padding: 40px 20px; }

header { text-align: center; margin-bottom: 36px; }
header h1 {
  font-size: 2.2em;
  font-weight: 700;
  letter-spacing: .04em;
  margin-bottom: 6px;
}
header .tagline { color: var(--dim); font-size: 1em; }

.search {
  max-width: 480px;
  margin: 0 auto 24px;
  position: relative;
}
.search input {
  width: 100%;
  padding: 12px 20px;
  border: 1px solid var(--border);
  border-radius: 24px;
  background: var(--card);
  color: var(--fg);
  font-size: .95em;
  outline: none;
}
.search input:focus { border-color: var(--accent); }

.tabs {
  display: flex; gap: 8px;
  justify-content: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.tab {
  padding: 7px 16px;
  border-radius: 18px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--dim);
  cursor: pointer;
  font-size: .88em;
  transition: all .2s;
}
.tab.active, .tab:hover {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.books {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 18px;
}
.book {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  transition: transform .2s;
}
.book:hover { transform: translateY(-2px); }
.book .cat {
  font-size: .72em;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 8px;
}
.book h3 { font-size: 1.05em; margin-bottom: 4px; line-height: 1.4; }
.book .author { color: var(--dim); font-size: .84em; margin-bottom: 10px; }
.book .desc { font-size: .84em; color: var(--dim); flex: 1; margin-bottom: 12px; }
.book .meta {
  display: flex; gap: 6px;
  font-size: .78em;
  color: var(--dim);
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.book .meta span {
  background: var(--tag);
  padding: 3px 9px;
  border-radius: 5px;
}
.book a.dl {
  padding: 9px;
  background: var(--accent);
  color: #fff;
  text-align: center;
  border-radius: 8px;
  text-decoration: none;
  font-size: .9em;
}
.book a.dl:hover { background: var(--accent-dim); }

.stats {
  text-align: center;
  color: var(--dim);
  font-size: .85em;
  margin-top: 36px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}

footer {
  text-align: center;
  margin-top: 40px;
  color: var(--dim);
  font-size: .8em;
}
footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>

<!-- 密码门 -->
<div class="gate" id="gate">
  <div class="gate-box">
    <div class="icon">📚</div>
    <h1>心理金融书籍库</h1>
    <p>请输入访问密码</p>
    <form id="gateForm">
      <input type="password" id="gatePwd" placeholder="密码" autofocus>
      <button type="submit">进入</button>
      <div class="gate-err" id="gateErr"></div>
    </form>
  </div>
</div>

<!-- 主内容 -->
<div class="container" id="main" style="display:none">
  <header>
    <h1>心理金融书籍库</h1>
    <p class="tagline">心理学 · 经济 · 金融 · 管理 — 参考书籍与讲义资料</p>
  </header>

  <div class="search">
    <input type="text" id="search" placeholder="搜索书名、作者或关键词..." autocomplete="off">
  </div>

  <div class="tabs">
    <div class="tab active" data-cat="all">全部</div>
    <div class="tab" data-cat="psych">心理学</div>
    <div class="tab" data-cat="econ">经济金融</div>
    <div class="tab" data-cat="accounting">会计统计</div>
  </div>

  <div class="books" id="books"></div>
  <div class="stats" id="stats"></div>

  <footer>
    <p>个人学习资料库 · <a href="https://github.com/Nicole8206929/study-materials">GitHub 仓库</a></p>
  </footer>
</div>

<script>
// 访问密码（SHA-256 hash，不明文存储）
const PASSWORD_HASH = "d2d05c17e708ca6134d5e66061e7cbd6cf989f3eb3476ead17028381e76cd68f";
let failCount = 0;
const MAX_FAIL = 5;

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

// 书籍数据
const books = [
  {
    title: "Psychology 2e",
    author: "Spielman, Jenkins, Lovett / OpenStax",
    cat: "psych", catName: "心理学",
    desc: "普通心理学系统教材：研究方法、学习记忆、思维、动机情绪、人格、社会心理、心理障碍与治疗。",
    pages: 755, size: "56 MB",
    file: "心理金融书籍/Psychology2e_OpenStax.pdf"
  },
  {
    title: "Principles of Finance 2e",
    author: "OpenStax",
    cat: "econ", catName: "经济金融",
    desc: "财务报表、货币时间价值、债券股票估值、资本预算、融资决策与风险管理。",
    pages: 629, size: "30 MB",
    file: "心理金融书籍/PrinciplesFinance2e_OpenStax.pdf"
  },
  {
    title: "Principles of Macroeconomics 3e",
    author: "Greenlaw, Shapiro, MacDonald / OpenStax",
    cat: "econ", catName: "经济金融",
    desc: "宏观经济学：GDP、通胀、失业、经济增长、货币与财政政策、国际贸易。",
    pages: 635, size: "33 MB",
    file: "心理金融书籍/Macroeconomics3e_OpenStax.pdf"
  },
  {
    title: "Principles of Microeconomics 3e",
    author: "Greenlaw, Shapiro, MacDonald / OpenStax",
    cat: "econ", catName: "经济金融",
    desc: "微观经济学：供需、弹性、消费者行为、生产成本、市场结构、要素市场。",
    pages: 595, size: "28 MB",
    file: "心理金融书籍/Microeconomics3e_OpenStax.pdf"
  },
  {
    title: "Principles of Financial Accounting",
    author: "Christine Jonick / UNG Press",
    cat: "accounting", catName: "会计统计",
    desc: "会计等式、借贷记账、调整分录、三大财务报表、财务分析与 Excel 练习。",
    pages: 318, size: "5.1 MB",
    file: "心理金融书籍/FinancialAccounting_Jonick.pdf"
  },
  {
    title: "OpenIntro Statistics 4th Edition",
    author: "Diez, Çetinkaya-Rundel, Barr / OpenIntro",
    cat: "accounting", catName: "会计统计",
    desc: "描述统计、概率分布、统计推断、回归分析，为读研究和财经数据提供基础。",
    pages: 440, size: "13 MB",
    file: "心理金融书籍/OpenIntroStatistics4.pdf"
  },
  {
    title: "Psychology Core Concepts",
    author: "Philip Zimbardo / 津巴多",
    cat: "psych", catName: "心理学",
    desc: "津巴多普通心理学核心概念：心智、行为与心理过程的经典入门教材。",
    pages: 500, size: "90 MB",
    file: "心理金融书籍/Zimbardo_Psychology_Core_Concepts.pdf"
  },
  {
    title: "人格心理学（第7版）",
    author: "Jerry Burger / 陈会昌译",
    cat: "psych", catName: "心理学",
    desc: "六大人格理论流派：精神分析、特质、生物、人本、行为与认知，附研究方法。",
    pages: 480, size: "37 MB",
    file: "心理金融书籍/Burger_Personality.pdf"
  },
  {
    title: "Principles of Economics 6e",
    author: "N. Gregory Mankiw / 曼昆",
    cat: "econ", catName: "经济金融",
    desc: "经济学原理经典教材：十大经济学原理、供需弹性、企业行为、宏观经济政策。",
    pages: 870, size: "27 MB",
    file: "心理金融书籍/Mankiw_Principles_Economics.pdf"
  },
  {
    title: "Principles of Microeconomics",
    author: "N. Gregory Mankiw / 曼昆",
    cat: "econ", catName: "经济金融",
    desc: "曼昆微观经济学分册：价格机制、市场效率、税制、消费者与生产者理论。",
    pages: 500, size: "14 MB",
    file: "心理金融书籍/Mankiw_Principles_Microeconomics.pdf"
  },
  {
    title: "The Economics of Money, Banking & Financial Markets",
    author: "Frederick Mishkin / 米什金",
    cat: "econ", catName: "经济金融",
    desc: "货币金融学：利率决定、银行体系、央行货币政策、金融市场与金融危机。",
    pages: 700, size: "39 MB",
    file: "心理金融书籍/Mishkin_Money_Banking.pdf"
  },
  {
    title: "Principles of Corporate Finance（学习指南）",
    author: "Brealey, Myers / 布雷利",
    cat: "econ", catName: "经济金融",
    desc: "公司金融配套学习指南：资本预算、估值、融资决策、资本结构与股利政策。",
    pages: 400, size: "39 MB",
    file: "心理金融书籍/Brealey_Corporate_Finance.pdf"
  }
];

// ===== 密码门 =====
const gate = document.getElementById("gate");
const gateForm = document.getElementById("gateForm");
const gatePwd = document.getElementById("gatePwd");
const gateErr = document.getElementById("gateErr");
const main = document.getElementById("main");

if (sessionStorage.getItem("authed") === "1") {
  gate.classList.add("hidden");
  main.style.display = "block";
}

gateForm.addEventListener("submit", async e => {
  e.preventDefault();
  if (failCount >= MAX_FAIL) {
    gateErr.textContent = "错误次数过多，请30秒后再试";
    return;
  }
  const inputHash = await sha256(gatePwd.value);
  if (inputHash === PASSWORD_HASH) {
    sessionStorage.setItem("authed", "1");
    gate.classList.add("hidden");
    main.style.display = "block";
    gateErr.textContent = "";
    failCount = 0;
  } else {
    failCount++;
    gateErr.textContent = `密码错误（${failCount}/${MAX_FAIL}）`;
    gatePwd.value = "";
    if (failCount >= MAX_FAIL) {
      gatePwd.disabled = true;
      setTimeout(() => { gatePwd.disabled = false; failCount = 0; gateErr.textContent = ""; }, 30000);
    }
  }
});

// ===== 书籍渲染 =====
let curCat = "all", curSearch = "";

function render() {
  const filtered = books.filter(b => {
    if (curCat !== "all" && b.cat !== curCat) return false;
    if (curSearch) {
      const s = curSearch.toLowerCase();
      return b.title.toLowerCase().includes(s) ||
             b.author.toLowerCase().includes(s) ||
             b.desc.toLowerCase().includes(s);
    }
    return true;
  });

  document.getElementById("books").innerHTML = filtered.map(b => `
    <div class="book">
      <div class="cat">${b.catName}</div>
      <h3>${b.title}</h3>
      <div class="author">${b.author}</div>
      <div class="desc">${b.desc}</div>
      <div class="meta">
        <span>${b.pages} 页</span>
        <span>${b.size}</span>
        <span>PDF</span>
      </div>
      <a class="dl" href="${b.file}" target="_blank">下载 / 查看 PDF</a>
    </div>
  `).join("");

  document.getElementById("stats").textContent =
    `共 ${books.length} 本书 · 显示 ${filtered.length} 本`;
}

document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    curCat = t.dataset.cat;
    render();
  });
});

document.getElementById("search").addEventListener("input", e => {
  curSearch = e.target.value;
  render();
});

render();
</script>
</body>
</html>
